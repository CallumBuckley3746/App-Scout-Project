{% extends "base.html" %}
{% block title %}Catalog{% endblock %}
{% block body %}
  <div class="title-row">
    <h1>Catalog</h1>
    <a class="button" href="/admin/services/new">New service</a>
  </div>
  {% if services %}
    <ul class="list">
      {% for item in services %}
        <li>
          <a href="/admin/services/{{ item.slug }}">
            <strong>{{ item.name }}</strong>
            <span class="muted">{{ item.domain }}</span>
          </a>
          <span class="pill">{{ item.status | status_label }}</span>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p class="empty">No services yet.</p>
  {% endif %}
{% endblock %}
