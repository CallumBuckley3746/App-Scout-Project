services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: downdetector
      POSTGRES_PASSWORD: downdetector
      POSTGRES_DB: downdetector
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U downdetector -d downdetector"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://downdetector:downdetector@postgres:5432/downdetector
      REDIS_URL: redis://redis:6379/0
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: change-me-please
      COOKIE_SECURE: "false"
      SESSION_TTL_SECONDS: "28800"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn downdetector.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  postgres_data:
